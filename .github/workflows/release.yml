name: Release

# 版本号唯一来源：仓库根目录 version.txt（原样取用，不做格式校验、不做预发布判定）
#  exe / zip / artifact 名全部等于 version.txt 的内容（后缀是什么就带什么）。
# 触发方式：
#   1. 发版：推 tag `v<版本>`（惯例是与 version.txt 保持一致）
#   2. 试构建：Actions -> Release -> Run workflow（只构建出 Artifact，不发 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release job 需要 git describe 找上一个 tag，必须保留完整历史
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12 自带 tkinter，且 PyInstaller 支持成熟
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_win.txt
          pip install pyinstaller

      # 版本号从 version.txt 读出，后续 exe 名 / zip 名 / artifact 名全部由它推导；
      # 内容原样使用（不校验格式、不区分正式版/预览版），写什么产物就叫什么
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content -Path version.txt -Raw).Trim()
          if (-not $v) { throw "version.txt 为空" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "VERSION=$v  REF=$env:GITHUB_REF"

      # 构建 + 产物自检：失败时把日志尾部提升为 Annotation，避免只看到一个退出码
      - name: Build release package
        shell: pwsh
        env:
          # Windows runner 的 stdout 默认是本地代码页，打印中文随包文件名会 UnicodeEncodeError；
          # build.py / run.py 内部已 reconfigure，这里只是双保险
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PKG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python build.py 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            # onedir：产物是 dist\SuperStar\{SuperStar.exe, runtime\}
            if (-not (Test-Path "dist\SuperStar\SuperStar.exe")) { $code = 9 }
            # 运行时目录必须与 exe 同级产出，缺了 exe 起不来
            elseif (-not (Test-Path "dist\SuperStar\runtime")) { $code = 9 }
            elseif (-not (Test-Path "dist\SuperStar-$env:PKG_VERSION-win64.zip")) { $code = 9 }
          }
          if ($code -ne 0) {
            $tail = (Get-Content build.log -Tail 30) -join '%0A'
            Write-Output "::error title=build failed ($code)::$tail"
            throw "构建失败（退出码 $code），关键输出见上方 Annotation"
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperStar-${{ steps.ver.outputs.version }}-win64
          path: dist/SuperStar-${{ steps.ver.outputs.version }}-win64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # 手动触发只做构建校验（Artifact），发版必须走 tag
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号取自 tag；changelog 取上一个 tag 到现在的提交（没有历史 tag 就取最近 20 条）
      - name: Prepare release notes
        id: notes
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          {
            echo "changes<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: SuperStar-${{ needs.build-windows.outputs.version }}-win64
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          # Release 标题与产物名统一取 version.txt 的版本
          name: SuperStar ${{ needs.build-windows.outputs.version }}
          body: |
            ## SuperStar ${{ needs.build-windows.outputs.version }}

            Windows x64，请**完整解压整个压缩包**后运行 `SuperStar.exe`
            （解压后是一个文件夹，exe 与 runtime\ 必须放在一起，不能只拷 exe）

            ### 更新内容
            ${{ steps.notes.outputs.changes }}
          draft: false
          files: dist/SuperStar-${{ needs.build-windows.outputs.version }}-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
