; 随包分发的配置文件：本文件由压缩包自带，请勿删除（删了题库/通知配置就会丢失）。
; 直接修改本文件即可启用题库自动答题 / 外部通知；不配置则题库功能自动停用
; （章节检测/作业将跳过答题，仅完成视频/文档/阅读任务点）。

[tiku]
; 题库提供方，可选：TikuYanxi / TikuLike / TikuAdapter / AI / SiliconFlow
; 留空或删除本段即停用题库
provider=SiliconFlow

; 是否提交答题（true 提交，false 仅保存）
submit=true
; 最低题库覆盖率（0 表示不要求）
cover_rate=0
; 章节检测提交后平台判「不合格/需重新作答」时的重答次数（0 表示不重答）
work_retry=1
; 搜题间隔（秒）
delay=1.0

; ---- SiliconFlow / AI 专用（两个提供方共用下面三个字段）----
; provider=SiliconFlow → 接口地址填 https://api.siliconflow.cn/v1/chat/completions
; provider=AI          → OpenAI 兼容端点，如 DeepSeek 官方填 https://api.deepseek.com 、模型 deepseek-chat
siliconflow_key=
siliconflow_model=deepseek-ai/DeepSeek-V3.2
siliconflow_endpoint=https://api.siliconflow.cn/v1/chat/completions
min_interval_seconds=3
; 走代理时填，例如 http://127.0.0.1:7890；留空则直连
http_proxy=

; 判断题选项
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确

[notification]
; 外部通知（可选）：ServerChan / Qmsg / Bark / Telegram
provider=
url=
