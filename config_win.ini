; 随包分发的配置文件：本文件由压缩包自带，请勿删除（删了题库/通知配置就会丢失）。
; 直接修改本文件即可启用题库自动答题 / 外部通知；不配置则题库功能自动停用
; （章节检测/作业将跳过答题，仅完成视频/文档/阅读任务点）。
; 图形界面的「答题设置」会按所选提供方只显示该提供方需要的项，并写入本段。

[tiku]
; 答案提供方式，可选：TikuYanxi / TikuLike / TikuAdapter / AI / DeepSeek / SiliconFlow
; 留空或删除本段即停用题库（只做视频/文档任务点，不答题）
provider=SiliconFlow

; ---- 通用项（所有提供方都生效）----
; 是否提交答题（true 提交，false 仅保存）
submit=true
; 最低题库覆盖率（0 表示不要求）
cover_rate=0
; 章节检测提交后平台判「不合格/需重新作答」时的重答次数（0 表示不重答）
work_retry=1
; 搜题间隔（秒）
delay=1.0
; 判断题选项
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确

; ---- TikuYanxi（言溪题库 https://tk.enncy.cn/）----
; 言溪 TOKEN，多个用英文逗号分隔，按顺序使用
tokens=

; ---- TikuLike（LIKE 知识库 https://www.datam.site/）----
; 同样使用上面的 tokens；以下是 LIKE 专属开关
likeapi_search=false
likeapi_vision=true
likeapi_model=glm-4.5-air
likeapi_retry=true
likeapi_retry_times=3

; ---- TikuAdapter（自建服务 https://github.com/DokiDoki1103/tikuAdapter）----
; 填本地/远程 TikuAdapter 的查询地址，例如 http://127.0.0.1:5000/api/search
url=

; ---- AI（任意 OpenAI 兼容端点，如自建 OneAPI / Ollama）----
; 接口地址填 base_url：如 https://api.openai.com/v1 、本地 http://127.0.0.1:11434/v1
; （误填成 .../chat/completions 也会自动去掉该后缀）
; 三项留空时沿用 SiliconFlow 的地址/Key/模型（兼容老配置）；界面上选中 AI 会预填
; https://api.openai.com/v1 + gpt-3.5-turbo，按需改成自己的端点即可
endpoint=
key=
model=
; 是否允许 API Key 留空（仅 provider=AI 的免鉴权自建端点可设 true）
; false 时未配置 Key 一律不发请求，题目随机作答
ignore_api_key=false

; ---- DeepSeek（官方端点，OpenAI 兼容）----
deepseek_endpoint=https://api.deepseek.com/v1
deepseek_key=
deepseek_model=deepseek-chat

; ---- SiliconFlow（硅基流动 https://siliconflow.cn/）----
; 注意：这里的接口地址是完整地址（含 /chat/completions）
siliconflow_endpoint=https://api.siliconflow.cn/v1/chat/completions
siliconflow_key=
siliconflow_model=deepseek-ai/DeepSeek-V3.2

; ---- 大模型公共项（AI / DeepSeek / SiliconFlow）----
; 最小请求间隔（秒）
min_interval_seconds=3
; 走代理时填，例如 http://127.0.0.1:7890；留空则直连
http_proxy=

[notification]
; 外部通知（可选）：ServerChan / Qmsg / Bark / Telegram
provider=
url=
